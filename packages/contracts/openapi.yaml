    get:
      summary: 编辑或管理员读取相册原图数量与字节总数
      x-required-roles: [EDITOR, ADMIN]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 历史照片缺失原图时只统计缺失，不从 WebP 重建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlbumOriginalSummary" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /albums/{id}/originals.zip:
    get:
      summary: 流式下载相册原图 ZIP
      description: private, no-store。包含 originals/ 下的原图及 manifest.jsonl；历史缺图标为 ORIGINAL_NOT_RETAINED，不暴露对象键。逐张校验大小及 SHA-256，读取失败或权限变化时中止。与学时导出共享单并发名额。
      x-required-roles: [EDITOR, ADMIN]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 原图归档
          content:
            application/zip:
              schema: { type: string, format: binary }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: 无保留原图或已有导出正在生成 }
  /admin/credit-hours/submission-batches:
    post:
      summary: 管理员以相同活动和理由原子录入多名用户学时
      description: ADMIN 专用；1-100 个不同 ACTIVE 用户，禁止包含本人。每人独立小时数，整批成功或回滚；同键同内容返回原批次，变更内容返回 409。直接 APPROVED，不创建凭证或 AI 审核任务。
      x-required-roles: [ADMIN]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminCreditHourBatchCreateRequest" }
      responses:
        "201":
          description: 已提交的完整批次（包括幂等重放）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCreditHourBatchCreateResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /announcements/status:
    get:
      summary: 获取最新已发布且未撤回的公告及当前账号回执
      description: 先选最新再查回执；确认最新后不依次强制展示旧公告。所有公告响应 private, no-store。
      responses:
        "200":
          description: 无公告时 latest 为 null
          content:
            application/json:
              schema:
                type: object
                required: [latest]
                properties:
                  latest:
                    anyOf:
                      - $ref: "#/components/schemas/Announcement"
                      - { type: "null" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /announcements:
    get:
      summary: 分页读取已发布且未撤回公告的历史摘要
      parameters:
        - $ref: "#/components/parameters/AnnouncementCursor"
        - $ref: "#/components/parameters/AnnouncementPageSize"
      responses:
        "200":
          description: 按发布时间和 ID 倒序，读取不产生回执
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnnouncementPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /announcements/{id}:
    get:
      summary: 读取公告正文，不自动确认已读
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { $ref: "#/components/responses/AnnouncementDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
  /announcements/{id}/read:
    post:
      summary: 当前账号显式确认公告已读
      description: 通过 CSRF 校验后幂等写入账号回执；不接受客户端指定用户。已撤回公告不可确认。
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "201":
          description: 账号回执
          content:
            application/json:
              schema:
                type: object
                required: [id, readAt]
                properties:
                  id: { type: string }
                  readAt: { type: string, format: date-time }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/announcements:
    get:
      summary: 管理员分页筛选公告摘要
      x-required-roles: [ADMIN]
      parameters:
        - $ref: "#/components/parameters/AnnouncementCursor"
        - $ref: "#/components/parameters/AnnouncementPageSize"
        - in: query
          name: keyword
          schema: { type: string, minLength: 1, maxLength: 160 }
        - in: query
          name: status
          schema: { type: string, enum: [DRAFT, PUBLISHED, WITHDRAWN] }
      responses:
        "200":
          description: 按创建时间和 ID 倒序的管理列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnnouncementPage" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      summary: 管理员创建纯文本公告草稿
      x-required-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnnouncementDraft" }
      responses:
        "201": { $ref: "#/components/responses/AnnouncementDetail" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/announcements/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      summary: 管理员读取草稿、发布或撤回公告正文
      x-required-roles: [ADMIN]
      responses:
        "200": { $ref: "#/components/responses/AnnouncementDetail" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      summary: 按版本更新草稿，发布后的内容不可修改
      x-required-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/AnnouncementDraft"
                - $ref: "#/components/schemas/AnnouncementAction"
      responses:
        "200": { $ref: "#/components/responses/AnnouncementDetail" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      summary: 按版本删除草稿
      x-required-roles: [ADMIN]
      requestBody: { $ref: "#/components/requestBodies/AnnouncementAction" }
      responses:
        "200":
          description: 草稿已删除
          content:
            application/json:
              schema:
                type: object
                required: [id, deleted]
                properties:
                  id: { type: string }
                  deleted: { type: boolean, const: true }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /admin/announcements/{id}/publish:
    post:
      summary: 按版本原子发布公告
      description: 发布时间由服务端确定；相同版本的成功发布可幂等重放。
      x-required-roles: [ADMIN]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody: { $ref: "#/components/requestBodies/AnnouncementAction" }
      responses:
        "201": { $ref: "#/components/responses/AnnouncementDetail" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /admin/announcements/{id}/withdraw:
    post:
      summary: 按版本撤回已发布公告，保留回执和审计
      x-required-roles: [ADMIN]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody: { $ref: "#/components/requestBodies/AnnouncementAction" }
      responses:
        "201": { $ref: "#/components/responses/AnnouncementDetail" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

components:
  requestBodies:
    AnnouncementAction:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AnnouncementAction" }
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: bmc3_session
  parameters:
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema: { type: string, minLength: 1, maxLength: 191 }
    AnnouncementCursor:
      in: query
      name: cursor
      schema: { type: string, minLength: 1, maxLength: 512 }
    AnnouncementPageSize:
      in: query
      name: pageSize
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Id:
      in: path
      name: id
      required: true
      schema: { type: string }
    Page:
      in: query
      name: page
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      in: query
      name: pageSize
      schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
    IncludeNewsBody:
      in: query
      name: includeBody
      description: 兼容旧客户端的正文开关；新列表客户端应传 false。
      schema: { type: boolean, default: true }
  responses:
    AnnouncementDetail:
      description: 纯文本公告详情；成员响应含账号 readAt，读取不产生已读副作用
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Announcement" }
    Unauthorized:
      description: 未登录、会话失效或凭据无效
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Forbidden:
      description: 当前账号无权限或操作被安全规则拒绝
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    NotFound:
      description: 目标不存在
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Conflict:
      description: 操作与当前资源状态冲突
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    ValidationError:
      description: 请求体校验失败
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
  schemas:
    CreditHourSubmission:
      type: object
      required: [id, status, revision, hours, activityName, sourceDescription, evidence]
      properties:
        id: { type: string }
        status: { $ref: "#/components/schemas/CreditHourSubmissionStatus" }
        revision: { type: integer, minimum: 1 }
        hours: { type: number, minimum: 0.5, maximum: 1000, multipleOf: 0.5 }
        activityName: { type: string }
        sourceDescription: { type: string }
        evidence: { type: array, items: { type: object } }
        manualReview:
          anyOf:
            - $ref: "#/components/schemas/CreditHourManualReview"
            - { type: "null" }
    AlbumOriginalSummary:
      type: object
      required: [albumId, photoCount, originalCount, missingOriginalCount, originalBytes, canExport]
      properties:
        albumId: { type: string }
        photoCount: { type: integer, minimum: 0 }
        originalCount: { type: integer, minimum: 0 }
        missingOriginalCount: { type: integer, minimum: 0 }
        originalBytes: { type: integer, minimum: 0 }
        canExport: { type: boolean }
    AdminCreditHourBatchCreateRequest:
      type: object
      additionalProperties: false
      required: [type, activityName, description, entries]
      properties:
        type: { type: string, enum: [QUALITY, VOLUNTEER] }
        activityName: { type: string, minLength: 1, maxLength: 160 }
        description: { type: string, minLength: 1, maxLength: 2000 }
        entries:
          type: array
          minItems: 1
          maxItems: 100
          description: userId 必须唯一；目标为其他 ACTIVE 用户
          items:
            type: object
            additionalProperties: false
            required: [userId, hours]
            properties:
              userId: { type: string, minLength: 1, maxLength: 191 }
              hours: { type: number, minimum: 0.5, maximum: 1000, multipleOf: 0.5 }
    AdminCreditHourBatchCreateResponse:
      type: object
      required: [id, count, items]
      properties:
        id: { type: string }
        count: { type: integer, minimum: 1, maximum: 100 }
        items:
          type: array
          items:
            type: object
            required: [id, userId, hours]
            properties:
              id: { type: string }
              userId: { type: string }
              hours: { type: number, minimum: 0.5, maximum: 1000, multipleOf: 0.5 }
    CreditHourSubmissionStatus:
      type: string
      enum: [PENDING_REVIEW, PENDING_MANUAL_REVIEW, APPROVED, REJECTED, WITHDRAWN]
      description: PENDING_MANUAL_REVIEW 不计入已通过汇总，允许本人撤回；须由管理员作出通过或拒绝决定，不能以 AI 重试或重新打开绕过人工分流。
    CreditHourManualReview:
      type: object
      required: [transferredAt, reason, riskCodes]
      properties:
        transferredAt: { type: [string, "null"], format: date-time }
        reason: { type: string }
        riskCodes:
          type: array
          items:
            type: string
            enum: [OFFICIAL_SEAL_MISSING, OFFICIAL_SEAL_UNCLEAR, SUSPECTED_AI_GENERATION, SUSPECTED_IMAGE_MANIPULATION, EVIDENCE_AUTHENTICITY_UNCERTAIN]
    AnnouncementDraft:
      type: object
      required: [title, body]
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        body: { type: string, minLength: 1, maxLength: 20000, description: 纯文本，保留换行，不解释 HTML }
    AnnouncementAction:
      type: object
      required: [expectedRevision]
      properties:
        expectedRevision: { type: integer, minimum: 1 }
    AnnouncementSummary:
      type: object
      required: [id, title, status, revision, publishedAt, withdrawnAt, createdAt, updatedAt]
      properties:
        id: { type: string }
        title: { type: string, maxLength: 160 }
        status: { type: string, enum: [DRAFT, PUBLISHED, WITHDRAWN] }
        revision: { type: integer, minimum: 1 }
        publishedAt: { type: [string, "null"], format: date-time }
        withdrawnAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        readAt: { type: [string, "null"], format: date-time }
    Announcement:
      allOf:
        - $ref: "#/components/schemas/AnnouncementSummary"
        - type: object
          required: [body]
          properties:
            body: { type: string, maxLength: 20000 }
    AnnouncementPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AnnouncementSummary" }
        nextCursor: { type: [string, "null"] }
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, time]
      properties:
        status: { type: string, const: ok }
        time: { type: string, format: date-time }
    ReadinessResponse:
      type: object
      additionalProperties: false
      required: [status, time, dependencies]
      properties:
        status: { type: string, const: ok }
        time: { type: string, format: date-time }
        dependencies:
          type: object
          additionalProperties: false
          required: [database, vector]
          properties:
            database: { type: string, const: ok }
            vector:
              type: object
              additionalProperties: false
              required: [collection, alias, status, dimensions]
              properties:
                collection: { type: string }
                alias: { type: string }
                status: { type: string }
                dimensions: { type: integer, minimum: 1 }
    Role:
      type: string
      enum: [MEMBER, EDITOR, ADMIN]
    AccountStatus:
      type: string
      enum: [PENDING, ACTIVE, SUSPENDED]
    Visibility:
      type: string
      enum: [PUBLIC, MEMBERS]
    ContentStatus:
      type: string
      enum: [DRAFT, PUBLISHED, ARCHIVED]
    NewsEditableStatus:
      type: string
      enum: [DRAFT, PUBLISHED]
    KnowledgeKind:
      type: string
      enum: [ARTICLE, PDF, DOCX, MARKDOWN]
    KnowledgeLibraryScope:
      type: string
      enum: [SHARED, PRIVATE]
    KnowledgeConversationMode:
      type: string
      enum: [SHARED, PRIVATE, COMBINED]
    KnowledgeRenderStatus:
      type: string
      enum: [PENDING, READY, FAILED]
    KnowledgeImportStatus:
      type: string
      enum: [PREFLIGHT_PENDING, PREFLIGHTING, INVALID, AWAITING_CONFIRMATION, INDEX_PENDING, PROCESSING, READY, FAILED, COMPENSATION_FAILED, EXPIRED]
    ImportSourceCleanupStatus:
      type: string
      enum: [RETAINED, PENDING, IN_PROGRESS, CLEANED, FAILED]
    IndexStatus:
      type: string
      enum: [PENDING, PROCESSING, READY, FAILED]
    ChapterMatch:
      type: string
      enum: [ANY, ALL]
      default: ANY
    QuizQuestionCategory:
      type: string
      enum: [STANDARD, KNOWLEDGE_RECALL]
    QuizQuestionOrigin:
      type: string
      enum: [MANUAL, CSV, AI_GENERATED]
    QuizQuestionSourceFilter:
      type: string
      enum: [AI, NON_AI]
    Subject:
      type: object
      additionalProperties: false
      required: [id, name, slug, sortOrder, active]
      properties:
        id: { type: string }
        name: { type: string, maxLength: 100 }
        slug: { type: string, maxLength: 100 }
        sortOrder: { type: integer }
        active: { type: boolean }
    SubjectChapter:
      type: object
      additionalProperties: false
      required: [id, subjectId, name, slug, sortOrder, active]
      properties:
        id: { type: string }
        subjectId: { type: string }
        name: { type: string, maxLength: 100 }
        slug: { type: string, maxLength: 100 }
        sortOrder: { type: integer }
        active: { type: boolean }
    DirectoryCreateRequest:
      type: object
      additionalProperties: false
      required: [name, slug]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        slug:
          type: string
          minLength: 1
          maxLength: 100
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        sortOrder: { type: integer, minimum: -10000, maximum: 10000 }
        active: { type: boolean }
    DirectoryUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        slug:
          type: string
          minLength: 1
          maxLength: 100
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        sortOrder: { type: integer, minimum: -10000, maximum: 10000 }
        active: { type: boolean }
    KnowledgeSubject:
      type: object
      required: [id, name, slug, sortOrder, active]
      properties:
        id: { type: string }
        name: { type: string, maxLength: 100 }
        slug: { type: string, maxLength: 100 }
        sortOrder: { type: integer }
        active: { type: boolean }
    KnowledgeSubjectCreateRequest:
      type: object
      additionalProperties: false
      required: [name, slug]
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        slug: { type: string, minLength: 2, maxLength: 100 }
    KnowledgeLibraryCreateRequest:
      type: object
      additionalProperties: false
      required: [name, subjectId, scope]
      properties:
        name: { type: string, minLength: 2, maxLength: 160 }
        subjectId: { type: string }
        scope: { $ref: "#/components/schemas/KnowledgeLibraryScope" }
    KnowledgeLibrary:
      type: object
      required: [id, name, scope, ownerId, subjectId, subject, aiEnabled, aiEnabledAt, active, createdAt, updatedAt, _count]
      properties:
        id: { type: string }
        name: { type: string, maxLength: 160 }
        scope: { $ref: "#/components/schemas/KnowledgeLibraryScope" }
        ownerId: { type: [string, "null"] }
        subjectId: { type: string }
        subject: { $ref: "#/components/schemas/Subject" }
        aiEnabled: { type: boolean }
        aiEnabledAt: { type: [string, "null"], format: date-time }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        _count:
          type: object
          required: [documents, chapters]
          properties:
            documents: { type: integer, minimum: 0 }
            chapters: { type: integer, minimum: 0 }
        reader:
          type: object
          required: [documentCount, h2Count, contentUpdatedAt]
          properties:
            documentCount: { type: integer, minimum: 0 }
            h2Count: { type: integer, minimum: 0 }
            contentUpdatedAt: { type: [string, "null"], format: date-time }
    KnowledgeLibraryDirectory:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/KnowledgeLibrary" }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 50 }
    KnowledgeLibraryChapter:
      type: object
      additionalProperties: false
      required: [id, libraryId, name, slug, sortOrder]
      properties:
        id: { type: string }
        libraryId: { type: string }
        name: { type: string, maxLength: 100 }
        slug: { type: string, maxLength: 100 }
        sortOrder: { type: integer }
    KnowledgeLibraryChapterPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/KnowledgeLibraryChapter" }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
    KnowledgeImportJob:
      type: object
      required: [id, libraryId, fileType, sourceName, sourceSize, status, stage, nodeCount, estimatedChunkCount, imageCount, warningCount, errorCount, sourceCleanupStatus, sourceCleanupAttempts, sourceCleanupNextAttemptAt, sourceCleanupError, sourceCleanedAt, cancelRequestedAt, expiresAt, createdAt, updatedAt]
      properties:
        id: { type: string }
        libraryId: { type: string }
        targetDocumentId: { type: [string, "null"] }
        fileType: { type: string, enum: [MARKDOWN, ZIP] }
        sourceName: { type: string }
        sourceSize: { type: integer, maximum: 209715200 }
        status: { $ref: "#/components/schemas/KnowledgeImportStatus" }
        stage: { type: string }
        progressCurrent: { type: integer, minimum: 0 }
        progressTotal: { type: integer, minimum: 0 }
        title: { type: [string, "null"] }
        nodeCount: { type: integer, minimum: 0 }
        estimatedChunkCount: { type: integer, minimum: 0 }
        imageCount: { type: integer, minimum: 0 }
        processedImageBytes: { type: integer, minimum: 0 }
        warningCount: { type: integer, minimum: 0 }
        errorCount: { type: integer, minimum: 0 }
        errorCode: { type: [string, "null"] }
        errorMessage: { type: [string, "null"] }
        sourceCleanupStatus: { $ref: "#/components/schemas/ImportSourceCleanupStatus" }
        sourceCleanupAttempts: { type: integer, minimum: 0, maximum: 5 }
        sourceCleanupNextAttemptAt: { type: [string, "null"], format: date-time }
        sourceCleanupError: { type: [string, "null"] }
        sourceCleanedAt: { type: [string, "null"], format: date-time }
        cancelRequestedAt: { type: [string, "null"], format: date-time }
        confirmedVersionId: { type: [string, "null"] }
        expiresAt: { type: string, format: date-time }
        confirmedAt: { type: [string, "null"], format: date-time }
        completedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    KnowledgeImportJobPage:
