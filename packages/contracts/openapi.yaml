      x-required-roles: [ADMIN]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "201": { description: 返回 COMPLETE、PARTIAL 或 FAILED 清理状态 }
        "409": { $ref: "#/components/responses/Conflict" }
