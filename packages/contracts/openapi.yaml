              schema: { $ref: "#/components/schemas/AlbumPhotoPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    post:
      summary: 向已有相册上传图片
      description: 同时保留逐字节原图与独立 WebP 展示图；JPEG/PNG/WebP，最大 10 MiB、3200 万像素。同键同内容重试返回原记录，不同内容返回 409。
