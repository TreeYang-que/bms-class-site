      x-required-roles: [ADMIN]
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 1, maxLength: 191 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [userId, type, activityName, hours, description]
              properties:
                userId: { type: string, minLength: 1, maxLength: 191 }
                type: { type: string, enum: [QUALITY, VOLUNTEER] }
                activityName: { type: string, minLength: 1, maxLength: 160 }
                hours: { type: number, minimum: 0.5, maximum: 1000, multipleOf: 0.5 }
                description: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        "201": { description: 已创建直接通过且无凭证、无审核任务的记录 }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
