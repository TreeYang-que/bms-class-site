  /ai/conversations:
    get:
      summary: 分页列出当前用户的 AI 问答会话
      description: 仅返回当前用户拥有的会话，按 updatedAt 与 id 组成的稳定游标倒序分页。
      parameters:
        - in: query
          name: cursor
          schema: { type: string, maxLength: 512 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: 当前用户的会话摘要页
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiConversationListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /ai/conversations/{id}:
    get:
      summary: 获取当前用户拥有的 AI 问答会话
      description: 返回最近 200 条消息，并通过 hasEarlierMessages 标记是否存在更早消息。
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 会话详情
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiConversationDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: 显式删除当前用户拥有的 AI 问答会话
      description: 会话不会自动过期；删除会话和写入审计日志位于同一事务。
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 会话已删除
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiConversationDeleteResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /ai/chat:
    post:
      summary: 基于固定知识范围、Qdrant 召回和 MySQL 二次授权的流式问答
      description: 新会话固定学科、模式、1-20 个库和可选章节；续聊只能提交 conversationId。事件顺序为 meta、token、done，失败为 error；assistant 仅在完整生成后持久化。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KnowledgeChatRequest" }
      responses:
        "200":
          description: meta/token/done 或稳定 error 事件的数据流；不返回 reasoning_content
          content:
            text/event-stream:
              schema: { type: string }
              examples:
                meta:
                  value: "event: meta\ndata: {\"conversationId\":\"conversation-id\",\"citations\":[],\"images\":[]}\n\n"
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { description: Embedding 或 Qdrant 当前不可用，不回退关键词检索 }

  /credit-hours/submissions:
    get:
      summary: 分页读取当前用户的完整学时提交
      responses:
        "200": { description: 当前用户学时记录页 }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      summary: 以半小时精度提交一条学时记录和 1-5 张凭证
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 1, maxLength: 191 }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [type, activityName, hours, sourceDescription, evidence]
              properties:
                type: { type: string, enum: [QUALITY, VOLUNTEER] }
                activityName: { type: string, minLength: 1, maxLength: 160 }
                hours: { type: number, minimum: 0.5, maximum: 1000, multipleOf: 0.5 }
                sourceDescription: { type: string, minLength: 1, maxLength: 2000 }
                replacesSubmissionId: { type: string }
                evidence:
                  type: array
                  minItems: 1
                  maxItems: 5
                  items: { type: string, format: binary }
      responses:
        "201": { description: 提交与视觉审核任务已创建 }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { description: 图片或总请求体过大 }
        "422": { $ref: "#/components/responses/ValidationError" }
  /credit-hours/submissions/{id}:
    get:
      summary: 读取当前用户的一条完整学时记录
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 包含来源、决定理由、人工审核提示和展示图入口的本人详情
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreditHourSubmission" }
        "404": { $ref: "#/components/responses/NotFound" }
  /credit-hours/submissions/{id}/withdraw:
    post:
      summary: 携带 expectedRevision 撤回待审核记录
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "201": { description: 记录已撤回 }
        "409": { $ref: "#/components/responses/Conflict" }
  /credit-hours/evidence/{id}/display:
    get:
      summary: 当前 owner 或 ADMIN 读取学时展示图
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: database 模式的私有图片字节 }
        "302": { description: COS 模式的短时私有签名跳转 }
        "403": { $ref: "#/components/responses/Forbidden" }
  /credit-hours/me/summary:
    get:
      summary: 获取当前用户两类及合计的已通过小时数与状态计数
      responses:
        "200": { description: 本人学时汇总，小时最多一位小数 }
  /credit-hours/leaderboard:
    get:
      summary: 获取全部 ACTIVE 用户的两类学时、总学时和所选维度公示排行
      description: TOTAL 仅是 QUALITY 与 VOLUNTEER 的只读合计维度，不能用于提交；只聚合已通过且未删除记录，同学时共享名次，不返回账号、学号、来源或凭证。
      parameters:
        - in: query
          name: type
          schema: { type: string, enum: [QUALITY, VOLUNTEER, TOTAL], default: QUALITY }
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200": { description: 全员公示排行 }
