          description: 当前活动版本中的授权锚点和标题路径
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeReaderContext" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /knowledge/private-library-metadata:
    get:
      summary: 获取私有知识库元数据和计数，不返回正文、替代文本或图片
      x-required-roles: [ADMIN]
      responses:
        "200": { description: 私有库元数据分页 }
        "403": { $ref: "#/components/responses/Forbidden" }
  /knowledge/private-library-metadata/{id}/status:
    patch:
      summary: 管理员停用或恢复私有知识库
      x-required-roles: [ADMIN]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [active]
              properties: { active: { type: boolean } }
      responses:
        "200": { description: 状态已更新 }
        "403": { $ref: "#/components/responses/Forbidden" }
  /knowledge/imports:
    get:
      summary: 获取当前成员可管理的知识导入任务
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
      responses:
        "200":
          description: 导入任务分页
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeImportJobPage" }
    post:
      summary: 上传 Markdown 或最大 200 MiB 的 ZIP 知识包
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, libraryId]
              properties:
                file: { type: string, format: binary }
                libraryId: { type: string }
                targetDocumentId: { type: string }
      responses:
        "202":
          description: 已进入异步预检队列
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeImportJob" }
        "413": { description: 文件超过限制 }
  /knowledge/imports/{id}:
    get:
      summary: 获取知识导入任务
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: 导入任务
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeImportJob" }
    delete:
      summary: 取消知识导入任务
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: 已取消或已请求 Worker 取消 }
  /knowledge/imports/{id}/structure:
    get:
      summary: 分页获取预检后的知识树摘要
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - in: query
          name: cursor
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        "200":
          description: 节点摘要和图片引用
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeImportStructure" }
  /knowledge/imports/{id}/issues:
    get:
      summary: 分页获取知识包预检问题
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
      responses:
        "200":
          description: 预检问题分页
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeImportIssuePage" }
  /knowledge/imports/{id}/confirm:
    post:
      summary: 确认预检结果、原子预留容量并进入索引队列
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: 已确认
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeImportJob" }
  /knowledge/imports/{id}/retry-compensation:
    post:
      summary: 显式重试补偿失败任务的精确对象清理
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: 已重新进入补偿清理队列
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeImportJob" }
        "400": { $ref: "#/components/responses/ValidationError" }
  /knowledge/libraries/{libraryId}/documents:
    get:
      summary: 获取可访问知识库的文档
      parameters:
        - in: path
          name: libraryId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 文档列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeLibraryDocumentList" }
  /knowledge/documents/{documentId}/versions:
    get:
      summary: 获取文档版本列表
      parameters:
        - in: path
          name: documentId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 版本列表与活动版本
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeVersionList" }
  /knowledge/documents/{documentId}/versions/{versionId}/preview:
    get:
      summary: 管理者或私有 owner 获取单一候选文档预览清单
      description: 该接口只描述指定候选版本，不拼接知识库内其他文档；H1 仅在此管理预览中作为版本标识返回。
      parameters:
        - in: path
          name: documentId
          required: true
          schema: { type: string }
        - in: path
          name: versionId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 单候选预览清单
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgePreviewManifest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /knowledge/documents/{documentId}/versions/{versionId}/preview/range:
    get:
      summary: 双向获取单一候选文档的有界预览范围
      parameters:
        - in: path
          name: documentId
          required: true
          schema: { type: string }
        - in: path
          name: versionId
          required: true
          schema: { type: string }
        - in: query
          name: revision
          required: true
          schema: { type: string, minLength: 10, maxLength: 100 }
        - in: query
          name: anchor
          schema: { type: string, minLength: 1, maxLength: 191 }
        - in: query
          name: before
          schema: { type: integer, minimum: 0, maximum: 40, default: 8 }
        - in: query
          name: after
          schema: { type: integer, minimum: 0, maximum: 40, default: 16 }
      responses:
        "200":
          description: 仅来自指定候选版本的预览范围
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeReaderRangeResponse" }
        "409": { $ref: "#/components/responses/Conflict" }
  /knowledge/documents/{documentId}:
    delete:
      summary: 软删除知识文档并排队清理全部版本向量和图片
      parameters:
        - in: path
          name: documentId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 文档已失效并返回 cleanupPending
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeCleanupPending" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /knowledge/documents/{documentId}/tree:
    get:
      summary: 获取活动或指定版本的知识树
      parameters:
        - in: path
          name: documentId
          required: true
          schema: { type: string }
        - in: query
          name: versionId
          schema: { type: string }
      responses:
        "200":
          description: 知识树节点
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeTree" }
  /knowledge/documents/{documentId}/versions/{versionId}/publish:
    post:
      summary: 原子切换 Markdown 活动版本并同步 Qdrant payload
      parameters:
        - in: path
          name: documentId
          required: true
          schema: { type: string }
        - in: path
          name: versionId
          required: true
          schema: { type: string }
      responses:
        "200": { description: 版本已发布 }
        "503": { description: Qdrant 暂时不可用 }
  /knowledge/documents/{documentId}/rebuild:
    post:
      summary: 从活动 Markdown 创建不可变重建候选版本
      parameters:
        - in: path
          name: documentId
          required: true
          schema: { type: string }
      responses:
        "201": { description: 已创建重建任务 }
  /knowledge/documents/{documentId}/versions/{versionId}:
    delete:
      summary: 删除非活动版本并排队精确清理向量和图片关系
      parameters:
        - in: path
          name: documentId
          required: true
          schema: { type: string }
        - in: path
          name: versionId
          required: true
          schema: { type: string }
      responses:
        "200": { description: 清理任务已创建 }
  /knowledge/cleanup-jobs/{jobId}/retry:
    post:
      summary: 受权重试失败的知识向量或图片清理任务
      parameters:
        - in: path
          name: jobId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 清理任务已重新排队
          content:
            application/json:
              schema:
                type: object
                required: [jobId, queued]
                properties:
                  jobId: { type: string }
                  queued: { type: boolean, const: true }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /knowledge/manage:
    get:
      summary: 获取知识资料管理列表
      x-required-roles: [EDITOR, ADMIN]
      parameters:
        - in: query
          name: subjectId
          schema: { type: string }
      responses:
        "200":
          description: 包含草稿、索引和发布状态的管理列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeManageResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /knowledge/{id}:
    get:
      summary: 获取已发布资料详情
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 资料详情
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeDocumentDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: 删除知识资料、检索分片和原始上传对象
      description: 数据库先执行软删除；对象存储清理失败时保留对象键并返回 storageDeleted=false，允许后续重试。
      x-required-roles: [EDITOR, ADMIN]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 资料已从知识库删除
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeDeleteResult" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /knowledge/articles:
    post:
      summary: 已移除的文章创建入口
      deprecated: true
      x-required-roles: [EDITOR, ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, body]
              properties:
                title: { type: string, minLength: 2, maxLength: 200 }
                body: { type: string, minLength: 20, maxLength: 500000 }
                subjectId: { type: string }
      responses:
        "410": { description: 新知识只接受 Markdown 或 ZIP 知识包 }
        "403": { $ref: "#/components/responses/Forbidden" }
  /knowledge/files:
    post:
      summary: 已移除的 PDF/DOCX 创建入口
      deprecated: true
      x-required-roles: [EDITOR, ADMIN]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                title: { type: string, maxLength: 200 }
                subjectId: { type: string }
      responses:
        "410": { description: 新知识只接受 Markdown 或 ZIP 知识包 }
        "413": { description: 文件超过 200 MiB 限制 }
        "403": { $ref: "#/components/responses/Forbidden" }
  /knowledge/{id}/publish:
    patch:
      summary: 发布已完成索引的资料
      x-required-roles: [EDITOR, ADMIN]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: 已发布 }
        "400": { description: 资料尚未完成索引 }
  /knowledge/{id}/reindex:
    patch:
      summary: 重新加入资料索引队列
      x-required-roles: [EDITOR, ADMIN]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: 已加入索引队列 }
  /quizzes/start:
    post:
      summary: 随机抽题或按题目 ID 创建练习快照
      description: 随机抽题默认排除往年真题；传 questionIds 时按给定顺序自由组卷。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuizStartRequest" }
      responses:
        "201":
          description: 已生成不含答案的答题快照
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuizStartResponse" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /quizzes/attempts/active:
    get:
      summary: 获取当前成员最多五个未过期答题草稿或评分任务
      responses:
        "200":
          description: 按最近保存时间倒序返回的可恢复答题
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuizActiveAttemptList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /quizzes/attempts/{attemptId}:
    get:
      summary: 仅由所有者读取答题草稿、评分状态或既有结果
      parameters:
        - in: path
          name: attemptId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 当前答题生命周期快照
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuizAttemptLifecycle" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /quizzes/attempts/{attemptId}/draft:
    patch:
      summary: 按 revision 保存答案和位置并将草稿有效期续至七天后
      parameters:
        - in: path
          name: attemptId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuizDraftSaveRequest" }
      responses:
        "200":
          description: 草稿已保存并递增 revision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuizDraftSaveResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /quizzes/attempts/{attemptId}/abandon:
    post:
      summary: 幂等放弃未提交答题；评分中或已提交答题拒绝放弃
      parameters:
        - in: path
          name: attemptId
          required: true
          schema: { type: string }
      responses:
        "201":
          description: 答题已放弃或此前已放弃
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuizAbandonResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /quizzes/filters:
    get:
      summary: 获取按学科和章节分组的题型及往年真题筛选项
      responses:
        "200":
          description: 题库筛选树
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuizFiltersResponse" }
  /quizzes/questions:
    get:
      summary: 分页浏览整个题库
      description: 返回题干、选项和配图，但不返回答案、解析或简答题评分标准。
      parameters:
        - in: query
          name: subjectId
          schema: { type: string }
        - in: query
          name: chapterIds
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            maxItems: 20
            items: { type: string }
        - in: query
          name: chapterMatch
          schema: { $ref: "#/components/schemas/ChapterMatch" }
        - in: query
          name: includeCrossChapter
          schema: { type: boolean }
        - in: query
          name: typeLabel
          schema: { type: string, maxLength: 100 }
        - in: query
          name: source
          schema: { $ref: "#/components/schemas/QuizQuestionSourceFilter" }
        - in: query
          name: pastPaper
          schema: { type: string, enum: [ALL, EXCLUDE, ONLY], default: ALL }
        - in: query
          name: paperId
          schema: { type: string }
        - in: query
          name: search
          schema: { type: string, maxLength: 200 }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
      responses:
        "200":
          description: 无答案题目分页
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuizLibraryResponse" }
    post:
      summary: 创建一道题目
      x-required-roles: [EDITOR, ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuizQuestionWriteRequest" }
      responses:
        "201": { description: 已创建 }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /quizzes/imports:
    get:
      summary: 分页查看题目导入任务
      x-required-roles: [EDITOR, ADMIN]
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        "200":
          description: 导入任务分页
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuizImportListResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      summary: 上传 CSV 或 ZIP 并创建异步预检任务
      description: CSV 最大 2 MiB；ZIP 最大 200 MiB。任务预检通过后必须单独确认，上传本身不会创建题目、章节、试卷或图片。
      x-required-roles: [EDITOR, ADMIN]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, mode]
              properties:
                file: { type: string, format: binary }
                mode: { $ref: "#/components/schemas/QuizImportMode" }
                createMissingChapters:
                  type: boolean
                  default: false
                  description: 确认导入时创建 CSV 中不存在的章节；停用章节仍会拒绝
                subjectId: { type: string }
                pastPaperId: { type: string }
                pastPaperTitle: { type: string, maxLength: 160 }
                pastPaperYear: { type: integer, minimum: 1900, maximum: 2200 }
      responses:
        "202":
          description: 已进入预检队列
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuizImportJob" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /quizzes/imports/orphans:
    get:
      summary: 只读查看题目导入补偿失败对象
      x-required-roles: [ADMIN]
      responses:
        "200": { description: 导入孤儿对象报告 }
        "403": { $ref: "#/components/responses/Forbidden" }
  /quizzes/imports/{id}:
    get:
      summary: 获取导入任务、预检摘要与前 100 条问题
      x-required-roles: [EDITOR, ADMIN]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 导入任务详情
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuizImportJobDetail" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /quizzes/imports/{id}/confirm:
    post:
      summary: 幂等确认预检通过的导入任务
      x-required-roles: [EDITOR, ADMIN]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "201":
          description: 已确认或返回既有处理结果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuizImportJobDetail" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /quizzes/imports/{id}/cancel:
    post:
      summary: 幂等取消题库导入；已确认任务由 Worker 补偿并释放容量预留
      x-required-roles: [EDITOR, ADMIN]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "201":
          description: 已立即取消或记录异步取消请求
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuizImportJobDetail" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /quizzes/imports/{id}/issues.csv:
    get:
      summary: 下载完整预检问题清单
      x-required-roles: [EDITOR, ADMIN]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: UTF-8 CSV 问题清单
          content:
