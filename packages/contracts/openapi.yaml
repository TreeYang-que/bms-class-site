openapi: 3.1.0
info:
  title: 班级网站网站 API
  version: 0.1.0
servers:
  - url: /api/v1
security:
  - sessionCookie: []
paths:
  /health:
    get:
      security: []
      summary: 获取不包含运行时配置的 API 健康状态
      responses:
        "200":
          description: API 正常运行
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }
  /health/ready:
    get:
      security: []
      summary: 检查数据库、Qdrant 物理集合和精确 alias 映射
      responses:
        "200":
          description: API 已具备接收业务流量的全部必要依赖
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadinessResponse" }
        "503":
          description: 至少一个必要依赖或运行配置未就绪
  /auth/register:
    post:
      security: []
      summary: 使用邀请码申请账号
      responses:
        "201": { description: 申请已提交 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /auth/login:
    post:
      security: []
      summary: 登录并创建安全会话
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /auth/me:
    get:
      summary: 获取当前成员和 CSRF token
      responses:
        "200":
          description: 当前成员
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/logout:
    post:
      summary: 注销当前会话
      responses:
        "204": { description: 已注销 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /auth/change-password:
    post:
      summary: 修改当前成员密码并失效其他设备会话
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "201":
          description: 密码已更新
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /invites:
    get:
      summary: 列出邀请码元数据，不返回哈希或明文邀请码
      x-required-roles: [ADMIN]
      responses:
        "200":
          description: 邀请码列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InviteListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      summary: 生成一个仅显示一次的邀请码
      x-required-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateInviteRequest" }
      responses:
        "201":
          description: 邀请码已生成，code 仅在本次响应显示
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateInviteResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /invites/{id}/revoke:
    post:
      summary: 幂等撤销邀请码，不再次返回明文
      x-required-roles: [ADMIN]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "201":
          description: 邀请码已撤销或此前已经撤销
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InviteItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /users:
    get:
      summary: 获取成员列表
      x-required-roles: [ADMIN]
      responses:
        "200":
          description: 成员列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /users/{id}:
    patch:
      summary: 更新成员状态或角色
      description: 不能停用或降级当前登录管理员，也不能停用或降级最后一个 ACTIVE ADMIN。
      x-required-roles: [ADMIN]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUserRequest" }
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /users/{id}/reset-password:
    post:
      summary: 重置非当前管理员的成员密码并失效其会话
      x-required-roles: [ADMIN]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "201":
          description: 临时密码仅在本次响应显示
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResetPasswordResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/audit-logs:
    get:
      summary: 按复合游标和条件筛选审计日志
      x-required-roles: [ADMIN]
      parameters:
        - in: query
          name: cursor
          schema: { type: string, maxLength: 512 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
        - in: query
          name: actorId
          schema: { type: string, maxLength: 191 }
        - in: query
          name: action
          schema: { type: string, maxLength: 100 }
        - in: query
          name: targetType
          schema: { type: string, maxLength: 80 }
        - in: query
          name: targetId
          schema: { type: string, maxLength: 64 }
        - in: query
          name: from
          schema: { type: string, format: date-time }
        - in: query
          name: to
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: 审计日志列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditLogPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /admin/audit-logs.csv:
    get:
      summary: 按与列表相同的条件导出有界审计 CSV
      description: 最多导出 5000 条；X-Result-Truncated 明确标识是否仍有更多匹配记录。
      x-required-roles: [ADMIN]
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 5000, default: 5000 }
        - in: query
          name: actorId
          schema: { type: string, maxLength: 191 }
        - in: query
          name: action
          schema: { type: string, maxLength: 100 }
        - in: query
          name: targetType
          schema: { type: string, maxLength: 80 }
        - in: query
          name: targetId
          schema: { type: string, maxLength: 64 }
        - in: query
          name: from
          schema: { type: string, format: date-time }
        - in: query
          name: to
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: UTF-8 BOM CSV
          headers:
            X-Result-Limit:
              schema: { type: integer }
            X-Result-Truncated:
              schema: { type: boolean }
          content:
            text/csv:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /news:
    get:
      security: []
      summary: 分页获取公开动态
      description: includeBody 默认为 true 以兼容旧前端；新前端应传 false 并通过详情接口按需读取正文。
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/IncludeNewsBody"
      responses:
        "200":
          description: 动态列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NewsPage" }
    post:
      summary: 新建动态
      x-required-roles: [EDITOR, ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewsWriteRequest" }
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NewsRecord" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /news/members:
    get:
      summary: 分页获取成员可见的已发布动态
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/IncludeNewsBody"
      responses:
        "200":
          description: 动态列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NewsPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /news/members/{id}:
    get:
      summary: 获取成员可见的动态详情
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 动态详情
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NewsItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /news/drafts:
    get:
      summary: 获取当前编辑者自己的动态草稿
      x-required-roles: [EDITOR, ADMIN]
      responses:
        "200":
          description: 草稿列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NewsList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /news/drafts/{id}:
    get:
      summary: 获取当前编辑者自己的一篇动态草稿
      x-required-roles: [EDITOR, ADMIN]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 草稿详情
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NewsItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /news/manage:
    get:
      summary: 分页获取可管理的动态
      description: EDITOR 只能查看自己创建的动态；ADMIN 可查看所有未删除动态。
      x-required-roles: [EDITOR, ADMIN]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - in: query
          name: status
          schema: { $ref: "#/components/schemas/ContentStatus" }
      responses:
        "200":
          description: 可管理动态列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NewsManagePage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /news/manage/{id}:
    get:
      summary: 获取一篇可管理动态的详情
      description: EDITOR 只能读取自己创建的动态；ADMIN 可读取所有未删除动态。
      x-required-roles: [EDITOR, ADMIN]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 管理动态详情
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NewsItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /news/images:
    post:
      summary: 上传动态图片并压缩为不超过 300KB 的 WebP
      x-required-roles: [EDITOR, ADMIN]
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                albumId: { type: string, description: 同时加入的相册 ID }
                caption: { type: string, maxLength: 300 }
      responses:
        "201": { description: 图片已存入数据库 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /news/{id}:
    get:
      security: []
      summary: 获取公开动态详情
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 动态详情
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NewsItem" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      summary: 更新未归档动态
      description: EDITOR 只能修改自己创建的动态；ADMIN 可修改其他人的动态。expectedUpdatedAt 不匹配时返回 409。
      x-required-roles: [EDITOR, ADMIN]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewsUpdateRequest" }
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NewsRecord" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      summary: 软删除动态并释放正文图片关系
      description: EDITOR 只能删除自己创建的动态；ADMIN 可删除其他人的动态。图片对象由现有孤立媒体回收流程按宽限期处理。
      x-required-roles: [EDITOR, ADMIN]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 动态已软删除
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NewsDeleteResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /news/{id}/archive:
    patch:
      summary: 归档动态
      x-required-roles: [EDITOR, ADMIN]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewsVersionRequest" }
      responses:
        "200":
          description: 动态已归档
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NewsRecord" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /news/{id}/restore:
    patch:
      summary: 将已归档动态恢复为草稿
      x-required-roles: [EDITOR, ADMIN]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewsVersionRequest" }
      responses:
        "200":
          description: 动态已恢复为草稿
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NewsRecord" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /media/images/{id}/content:
    get:
      summary: 读取旧数据库图片或重定向到私有 COS；公开动态引用的图片允许匿名访问
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: 旧数据库图片内容 }
        "302": { description: 私有 COS 的短期签名读取地址 }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { description: 图片存储服务暂时不可用 }
  /media/images/orphans:
    get:
      summary: 只读列出没有相册、动态或题目关联的图片元数据
      x-required-roles: [ADMIN]
      responses:
        "200":
          description: 孤立图片报告；接口不会删除任何记录或对象
          content:
            application/json:
              schema:
                type: object
                required: [generatedAt, total, totalBytes, items, cosComparison]
                properties:
                  generatedAt: { type: string, format: date-time }
                  total: { type: integer, minimum: 0 }
                  totalBytes: { type: integer, minimum: 0 }
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, objectKey, size, createdAt, uploadedById]
                      properties:
                        id: { type: string }
                        objectKey: { type: [string, "null"] }
                        size: { type: integer, minimum: 0 }
                        createdAt: { type: string, format: date-time }
                        uploadedById: { type: [string, "null"] }
                  cosComparison:
                    description: database 模式为 null；COS 模式对账 media/ 前缀与 Photo.objectKey。
                    oneOf:
                      - type: "null"
                      - type: object
                        required:
                          [objectCount, untrackedObjects, missingObjects]
                        properties:
                          objectCount: { type: integer, minimum: 0 }
                          untrackedObjects:
                            type: array
                            items:
                              type: object
                              required: [key, size, lastModified]
                              properties:
                                key: { type: string }
                                size: { type: integer, minimum: 0 }
                                lastModified:
                                  { type: string, format: date-time }
                          missingObjects:
                            type: array
                            items:
                              type: object
                              required: [id, objectKey]
                              properties:
                                id: { type: string }
                                objectKey: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /albums:
    get:
      summary: 获取成员相册
      description: 默认只返回未归档相册摘要；includePhotos=true 保留旧客户端全量读取兼容，管理端可用 includeArchived=true 查看归档记录。
      parameters:
        - in: query
          name: includePhotos
          required: false
          schema: { type: boolean, default: false }
        - in: query
          name: includeArchived
          required: false
          description: 仅 EDITOR/ADMIN 可设为 true。
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: 相册列表（默认摘要，includePhotos=true 时为全量）
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/AlbumSummaryListResponse" }
                  - { $ref: "#/components/schemas/AlbumListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      summary: 创建相册
      x-required-roles: [EDITOR, ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlbumWriteRequest" }
      responses:
        "201":
          description: 相册已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlbumRecord" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /albums/{id}:
    get:
      summary: 兼容获取单个相册的完整照片列表
      description: 普通成员不可读取归档相册；新客户端应使用照片游标接口懒加载。
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 相册详情（含全部照片）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlbumItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      summary: 重命名相册
      x-required-roles: [EDITOR, ADMIN]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlbumRenameRequest" }
      responses:
        "200":
          description: 相册已重命名；照片关系保持不变
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlbumRecord" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /albums/{id}/archive:
    post:
      summary: 幂等归档相册并保留全部照片关系
      x-required-roles: [EDITOR, ADMIN]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "201":
          description: 相册已归档或此前已经归档
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlbumRecord" }
